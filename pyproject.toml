[project]
name = "eirene"
version = "0.1.20b3"
description = "Terminal AI agent for coding, automation and deployment."
readme = "README.md"
authors = [{ name = "s3p" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "textual-image>=0.8,<0.15",
    "rich>=14.3.3",
    "httpx>=0.27",
    "zstandard>=0.23; python_version < '3.14'",
    "mcp>=1.30,<2",
    "keyring>=25.0",
    "packaging>=24.0",
    "PyJWT[crypto]>=2.10",
    "websockets>=12.0",
]

[dependency-groups]
build = ["pyinstaller>=6.6", "pillow>=10.0"]
dev = [
    {include-group = "build"},
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
eirene = "eirene.__main__:main"

[tool.uv]
# Reject wheel-only releases that cannot run on our development/build platforms.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.14'",
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.14'",
    "sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eirene*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.package-data]
"eirene.ui" = ["logo.gray.zlib", "companion_assets/*.png"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["build", "dist", "release", ".venv-build-linux-x86_64"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
files = ["eirene/core/paths.py", "eirene/core/subprocesses.py", "eirene/core/updates.py"]
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[tool.coverage.run]
source = ["eirene"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
