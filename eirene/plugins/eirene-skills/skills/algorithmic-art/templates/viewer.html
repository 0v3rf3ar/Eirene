<!DOCTYPE html>
<!--
  Generative art viewer — the starting point for every piece.

  KEEP AS IS (the fixed chrome):
    - page layout: sidebar + canvas area, and the responsive rules
    - UI styling and the light/dark tokens in :root
    - the Seed section and its behaviour (field, Previous, Next, Random, jump)
    - the Actions section (Regenerate, Reset, Download PNG)
    - the CONTROLS binding code and the seed/actions functions

  REPLACE (marked "VARIABLE" below):
    - the <title>, the sidebar title and subtitle
    - the Parameters controls and the Colors controls (remove Colors if unused)
    - DEFAULTS and the CONTROLS list
    - the whole sketch: build(), draw() and any classes
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generative study</title> <!-- VARIABLE -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --text: #1b1d21;
      --muted: #646a73;
      --line: #dde0e5;
      --field: #f7f8fa;
      --accent: #3b6fd4;
      --accent-text: #ffffff;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317;
        --panel: #1a1d22;
        --text: #e7e9ec;
        --muted: #9aa1ab;
        --line: #2c3038;
        --field: #22262c;
        --accent: #7ea6ff;
        --accent-text: #0d1220;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 var(--sans);
      min-height: 100vh;
    }
    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 16px;
      padding: 16px;
      min-height: 100vh;
    }
    aside {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
      align-self: start;
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
    }
    aside h1 { font-size: 18px; font-weight: 650; margin: 0 0 4px; }
    aside .subtitle { color: var(--muted); margin: 0 0 20px; }
    section { border-top: 1px solid var(--line); padding: 16px 0; }
    section:last-child { padding-bottom: 0; }
    section h2 {
      font-size: 12px; font-weight: 600; color: var(--muted);
      margin: 0 0 12px; letter-spacing: .02em;
    }
    .seed-field {
      width: 100%; padding: 9px 10px; margin-bottom: 8px;
      font: 15px var(--mono); text-align: center;
      background: var(--field); color: var(--text);
      border: 1px solid var(--line); border-radius: 6px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row + .row, .row + button, button + .row { margin-top: 8px; }
    button {
      font: inherit; font-weight: 550; cursor: pointer;
      padding: 8px 10px; border-radius: 6px; width: 100%;
      border: 1px solid var(--line); background: var(--field); color: var(--text);
    }
    button:hover { border-color: var(--muted); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .control { margin-bottom: 14px; }
    .control:last-child { margin-bottom: 0; }
    .control label { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .control output { font: 12px var(--mono); color: var(--muted); }
    .control input[type=range] { width: 100%; accent-color: var(--accent); }
    .swatch { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .swatch:last-child { margin-bottom: 0; }
    .swatch input[type=color] {
      width: 44px; height: 28px; padding: 0; border: 1px solid var(--line);
      border-radius: 6px; background: none; cursor: pointer;
    }
    .swatch code { font: 12px var(--mono); color: var(--muted); margin-right: auto; margin-left: 10px; }
    main {
      display: flex; align-items: center; justify-content: center;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 16px; min-height: calc(100vh - 32px);
    }
    #canvas-container { width: 100%; display: flex; justify-content: center; }
    #canvas-container canvas {
      display: block; max-width: 100%; height: auto !important;
      max-height: calc(100vh - 64px); width: auto !important; aspect-ratio: 1;
      box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.08);
    }
    .status { color: var(--muted); }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      aside { position: static; max-height: none; }
      main { min-height: auto; }
      #canvas-container canvas { max-height: none; width: 100% !important; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <h1>Generative study</h1>                                   <!-- VARIABLE -->
      <p class="subtitle">A one-line description of the piece.</p> <!-- VARIABLE -->

      <!-- FIXED: seed -->
      <section aria-label="Seed">
        <h2>Seed</h2>
        <input id="seed" class="seed-field" type="number" min="0" step="1" value="12345" aria-label="Seed">
        <div class="row">
          <button type="button" id="prev-seed">Previous</button>
          <button type="button" id="next-seed">Next</button>
        </div>
        <button type="button" id="random-seed">Random seed</button>
      </section>

      <!-- VARIABLE: one .control per parameter; keep the id equal to the params key -->
      <section aria-label="Parameters">
        <h2>Parameters</h2>
        <div class="control">
          <label for="particles">Particles <output id="particles-value"></output></label>
          <input type="range" id="particles" min="500" max="8000" step="100">
        </div>
        <div class="control">
          <label for="noiseScale">Noise scale <output id="noiseScale-value"></output></label>
          <input type="range" id="noiseScale" min="0.001" max="0.02" step="0.0005">
        </div>
        <div class="control">
          <label for="speed">Speed <output id="speed-value"></output></label>
          <input type="range" id="speed" min="0.2" max="3" step="0.1">
        </div>
        <div class="control">
          <label for="steps">Trail steps <output id="steps-value"></output></label>
          <input type="range" id="steps" min="50" max="600" step="10">
        </div>
      </section>

      <!-- VARIABLE (optional): remove this section for fixed or monochrome palettes -->
      <section aria-label="Colors">
        <h2>Colors</h2>
        <div class="swatch"><label for="background">Background</label><code id="background-value"></code><input type="color" id="background"></div>
        <div class="swatch"><label for="ink">Ink</label><code id="ink-value"></code><input type="color" id="ink"></div>
        <div class="swatch"><label for="highlight">Highlight</label><code id="highlight-value"></code><input type="color" id="highlight"></div>
      </section>

      <!-- FIXED: actions -->
      <section aria-label="Actions">
        <h2>Actions</h2>
        <button type="button" class="primary" id="regenerate">Regenerate</button>
        <div class="row">
          <button type="button" id="reset">Reset</button>
          <button type="button" id="download">Download PNG</button>
        </div>
      </section>
    </aside>

    <main>
      <div id="canvas-container"><p class="status">Loading…</p></div>
    </main>
  </div>

  <script>
    // ---------------------------------------------------------------- VARIABLE
    // Defaults for every tunable value. Keys match control ids.
    const DEFAULTS = {
      seed: 12345,
      particles: 3000,
      noiseScale: 0.004,
      speed: 1.2,
      steps: 260,
      background: "#f3efe6",
      ink: "#22313f",
      highlight: "#c8553d",
    };

    // Which params have controls, how to read them, and whether a change
    // rebuilds the system (true) or only redraws it (false).
    const CONTROLS = [
      { key: "particles", type: "int", rebuild: true },
      { key: "noiseScale", type: "float", rebuild: true },
      { key: "speed", type: "float", rebuild: true },
      { key: "steps", type: "int", rebuild: true },
      { key: "background", type: "color", rebuild: true },
      { key: "ink", type: "color", rebuild: true },
      { key: "highlight", type: "color", rebuild: true },
    ];

    // ------------------------------------------------------------------ FIXED
    let params = structuredClone(DEFAULTS);

    function seedEverything(seed) {
      randomSeed(seed);
      noiseSeed(seed);
    }

    function setup() {
      const container = document.getElementById("canvas-container");
      container.innerHTML = "";
      const canvas = createCanvas(1200, 1200);
      canvas.parent(container);
      pixelDensity(1);
      bindControls();
      generate();
    }

    function generate() {
      seedEverything(params.seed);
      build();
      loop();
    }

    function bindControls() {
      for (const control of CONTROLS) {
        const input = document.getElementById(control.key);
        const shown = document.getElementById(control.key + "-value");
        if (!input) continue;
        const show = () => { if (shown) shown.textContent = String(params[control.key]); };
        input.value = params[control.key];
        show();
        input.addEventListener("input", () => {
          const raw = input.value;
          params[control.key] = control.type === "int" ? parseInt(raw, 10)
            : control.type === "float" ? parseFloat(raw) : raw;
          show();
          if (control.rebuild) generate(); else redraw();
        });
      }
      const seedField = document.getElementById("seed");
      seedField.addEventListener("change", () => setSeed(parseInt(seedField.value, 10)));
      document.getElementById("prev-seed").onclick = () => setSeed(params.seed - 1);
      document.getElementById("next-seed").onclick = () => setSeed(params.seed + 1);
      document.getElementById("random-seed").onclick = () => setSeed(Math.floor(Math.random() * 1e6));
      document.getElementById("regenerate").onclick = generate;
      document.getElementById("reset").onclick = resetParams;
      document.getElementById("download").onclick = () => saveCanvas(`artwork-seed-${params.seed}`, "png");
    }

    function setSeed(value) {
      if (!Number.isFinite(value) || value < 0) value = 0;
      params.seed = value;
      document.getElementById("seed").value = value;
      generate();
    }

    function resetParams() {
      const seed = params.seed;
      params = structuredClone(DEFAULTS);
      params.seed = seed; // Reset restores parameters, not the seed being explored
      for (const control of CONTROLS) {
        const input = document.getElementById(control.key);
        const shown = document.getElementById(control.key + "-value");
        if (input) input.value = params[control.key];
        if (shown) shown.textContent = String(params[control.key]);
      }
      generate();
    }

    // --------------------------------------------------------------- VARIABLE
    // Placeholder sketch: particles tracing a noise flow field. Replace it with
    // the algorithm your philosophy calls for.
    let walkers = [];
    let step = 0;

    function build() {
      walkers = [];
      step = 0;
      background(params.background);
      for (let i = 0; i < params.particles; i++) {
        walkers.push({ x: random(width), y: random(height), hot: random() < 0.06 });
      }
    }

    function draw() {
      const ink = color(params.ink); ink.setAlpha(26);
      const hot = color(params.highlight); hot.setAlpha(46);
      strokeWeight(1);
      for (let sub = 0; sub < 6 && step < params.steps; sub++, step++) {
        for (const w of walkers) {
          const angle = noise(w.x * params.noiseScale, w.y * params.noiseScale) * TWO_PI * 2;
          const nx = w.x + cos(angle) * params.speed;
          const ny = w.y + sin(angle) * params.speed;
          stroke(w.hot ? hot : ink);
          line(w.x, w.y, nx, ny);
          w.x = nx; w.y = ny;
          if (w.x < 0 || w.x > width || w.y < 0 || w.y > height) {
            w.x = random(width); w.y = random(height);
          }
        }
      }
      if (step >= params.steps) noLoop();
    }
  </script>
</body>
</html>
