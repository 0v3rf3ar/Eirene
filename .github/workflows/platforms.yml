name: Native binary builds

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python 3.14)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.14'
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev -- /bin/true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.1'
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Check types
        run: uv run --no-sync mypy
      - name: Run tests
        run: uv run --no-sync pytest -q

  build:
    name: Build ${{ matrix.target }} (Python 3.14)
    needs: test
    env:
      UV_PYTHON: '3.14'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-amd64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: macos-14
            target: macos-silicon
          - runner: windows-2022
            target: windows-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.1'
          enable-cache: true
      - name: Install build dependencies
        run: uv sync --locked --no-dev --group build
      - name: Verify build interpreter
        run: uv run --no-sync python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version; print(sys.version)"
      - name: Build and smoke-test executable
        run: uv run --no-sync python build.py --no-install --skip-tests
      - name: Compress and test extracted executable
        run: uv run --no-sync python scripts/package_release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
