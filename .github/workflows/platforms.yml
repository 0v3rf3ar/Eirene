name: Native binary builds

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      termux_only:
        description: Only run the experimental Termux package build
        type: boolean
        default: true
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python 3.14)
    if: github.event_name != 'workflow_dispatch' || !inputs.termux_only
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.14'
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev -- /bin/true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.1'
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Check types
        run: uv run --no-sync mypy
      - name: Run tests
        run: uv run --no-sync pytest -q

  windows-sandbox:
    name: Windows default sandbox (Python 3.14)
    if: github.event_name != 'workflow_dispatch' || !inputs.termux_only
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.14'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.1'
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked
      - name: Verify native test runner
        run: uv run --no-sync python -c "import os, sys; assert os.name == 'nt'; assert sys.version_info[:2] == (3, 14), sys.version"
      - name: Verify Eirene default execution uses kernel isolation
        run: uv run --no-sync pytest -q tests/test_windows_default_sandbox.py tests/test_windows_appcontainer.py

  build:
    name: Build ${{ matrix.target }} (Python 3.14)
    needs: [test, windows-sandbox]
    env:
      UV_PYTHON: '3.14'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-amd64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: macos-15
            target: macos-silicon
          - runner: windows-2022
            target: windows-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.1'
          enable-cache: true
      - name: Install build dependencies
        run: uv sync --locked --no-dev --group build
      - name: Verify build interpreter
        run: uv run --no-sync python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version; print(sys.version)"
      - name: Build executable after tests
        run: uv run --no-sync python build.py --no-install --skip-tests --skip-smoke
      - name: Compress executable
        run: uv run --no-sync python scripts/package_release.py --target ${{ matrix.target }} --skip-smoke
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  termux:
    name: Experimental Termux ARM64 package
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.1'
      - name: Export locked runtime dependencies
        run: |
          mkdir -p termux-input termux-output
          chmod 777 termux-output
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file termux-input/requirements.txt
      - name: Build and test in Android Bionic userspace
        run: |
          docker pull termux/termux-docker:aarch64
          docker image inspect termux/termux-docker:aarch64 --format '{{json .RepoDigests}}' > termux-output/container-image.txt
          docker run --rm --privileged \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/termux-input,target=/input,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/termux-output,target=/output" \
            termux/termux-docker:aarch64 bash /workspace/build/termux/build.sh
      - name: Upload tested experimental package
        uses: actions/upload-artifact@v6
        with:
          name: release-termux-aarch64
          path: |
            termux-output/*.deb
            termux-output/termux-build.txt
            termux-output/container-image.txt
          if-no-files-found: error
          retention-days: 7
