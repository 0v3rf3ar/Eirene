name: Native binary builds

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-amd64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: macos-14
            target: macos-silicon
          - runner: windows-2022
            target: windows-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.6" "pillow>=10.0"
      - name: Build and smoke-test executable
        run: python build.py --no-install --skip-tests
      - name: Compress and test extracted executable
        run: python scripts/package_release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
