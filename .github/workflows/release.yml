name: Release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
      - name: Match the tag to the package version
        id: channel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=$(python3 scripts/release_metadata.py --tag "$RELEASE_TAG")
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    uses: ./.github/workflows/platforms.yml

  publish:
    needs: [version, checks]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Verify binary archives and generate checksum manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          version=${RELEASE_TAG#v}
          expected=(
            "eirene-Linux-amd64-$version.tar.gz"
            "eirene-Linux-arm64-$version.tar.gz"
            "eirene-MacOS-silicon-$version.tar.gz"
            "eirene-Windows-amd64-$version.zip"
          )
          for asset in "${expected[@]}"; do
            test -s "$asset" || { echo "::error::missing or empty release archive: $asset"; exit 1; }
          done
          cp ../install.sh install.sh
          sha256sum "${expected[@]}" install.sh > SHA256SUMS
          cat SHA256SUMS
      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            [[ "$(cat release-state.txt)" == true ]] || { echo "::error::$RELEASE_TAG is already published; use a new tag"; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Eirene $RELEASE_TAG"
          fi
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if [[ -f "$notes" ]]; then
            gh release edit "$RELEASE_TAG" --notes-file "$notes"
          fi
          version=${RELEASE_TAG#v}
          gh release upload "$RELEASE_TAG" --clobber \
            "release/eirene-Linux-amd64-$version.tar.gz" \
            "release/eirene-Linux-arm64-$version.tar.gz" \
            "release/eirene-MacOS-silicon-$version.tar.gz" \
            "release/eirene-Windows-amd64-$version.zip" \
            release/install.sh \
            release/SHA256SUMS
          if [[ "$IS_PRERELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" --prerelease --draft=false --latest=false
          else
            gh release edit "$RELEASE_TAG" --prerelease=false --draft=false --latest
          fi
